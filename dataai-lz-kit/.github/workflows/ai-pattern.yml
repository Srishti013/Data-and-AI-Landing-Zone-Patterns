name: Deploy AI Landing Zone via GitHub Issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  Extract-Parameters-from-Issue:
    if: startsWith(github.event.issue.title, '[DEPLOY-AI]:')
    name: Extract Parameters from Issue
    runs-on: [self-hosted, Linux, X64, vmss-sea]
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    outputs:
      env_short:   ${{ steps.extract.outputs.env_short }}
      region_code: ${{ steps.extract.outputs.region_code }}
      iterator:    ${{ steps.extract.outputs.iterator }}

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Parameters
      id: extract
      env:
        ISSUE_BODY: ${{ github.event.issue.body }}
      run: |

        echo "$ISSUE_BODY" > issue.txt

        # GitHub issue forms render body as: ### Label\n\nValue
        SUBSCRIPTION=$(awk '/^### Subscription$/{getline; getline; print; exit}' issue.txt | xargs)
        ENV=$(awk '/^### Environment$/{getline; getline; print; exit}' issue.txt | xargs)
        REGION=$(awk '/^### Region$/{getline; getline; print; exit}' issue.txt | xargs)

        # Demo: workload subscription id comes from a repo variable
        # (Settings -> Secrets and variables -> Actions -> Variables: WORKLOAD_SUBSCRIPTION_ID).
        SUBSCRIPTION_ID="${{ vars.WORKLOAD_SUBSCRIPTION_ID }}"

        # Derive short env code from environment selection
        case "$ENV" in
          Prod) ENV_SHORT="pd" ;;
          Dev)  ENV_SHORT="dev" ;;
          SIT)  ENV_SHORT="sit" ;;
          UAT)  ENV_SHORT="uat" ;;
          *)    ENV_SHORT=$(echo "$ENV" | tr '[:upper:]' '[:lower:]') ;;
        esac

        # Map human-readable region name to short code + Azure location. Hub IPs
        # (DNS resolver, bastion) come from repo variables, not hardcoded here.
        case "$REGION" in
          "Malaysia West")  REGION_CODE="myw"; LOCATION="malaysiawest" ;;
          "Southeast Asia") REGION_CODE="sea"; LOCATION="southeastasia" ;;
          *)                REGION_CODE=$(echo "$REGION" | tr '[:upper:]' '[:lower:]' | tr ' ' '-'); LOCATION=$(echo "$REGION" | tr '[:upper:]' '[:lower:]' | tr -d ' ') ;;
        esac

        ORG=$(awk '/^### Organisation Code$/{getline; getline; print; exit}' issue.txt | xargs)
        AU=$(awk '/^### AU Code$/{getline; getline; print; exit}' issue.txt | xargs)
        BU=$(awk '/^### Business Unit Code$/{getline; getline; print; exit}' issue.txt | xargs)
        OWNER=$(awk '/^### Owner$/{getline; getline; print; exit}' issue.txt | xargs)
        ITERATOR=$(awk '/^### Iterator$/{getline; getline; print; exit}' issue.txt | xargs)
        BUSINESS_OWNER=$(awk '/^### Business Owner$/{getline; getline; print; exit}' issue.txt | xargs)
        BUSINESS_UNIT=$(awk '/^### Business Unit$/{getline; getline; print; exit}' issue.txt | xargs)
        CRITICALITY=$(awk '/^### Criticality$/{getline; getline; print; exit}' issue.txt | xargs)
        COST_CENTER=$(awk '/^### Cost Center$/{getline; getline; print; exit}' issue.txt | xargs)
        DATA_CLASSIFICATION=$(awk '/^### Data Classification$/{getline; getline; print; exit}' issue.txt | xargs)
        COMPLIANCE=$(awk '/^### Compliance$/{getline; getline; print; exit}' issue.txt | xargs)
        APP_NAME=$(awk '/^### Application Name$/{getline; getline; print; exit}' issue.txt | xargs)
        BUDGET_ID=$(awk '/^### Budget ID$/{getline; getline; print; exit}' issue.txt | xargs)
        STATUS=$(awk '/^### Status$/{getline; getline; print; exit}' issue.txt | xargs)
        APP_SUPPORT=$(awk '/^### Application Support Email$/{getline; getline; print; exit}' issue.txt | xargs)

        # Network CIDRs - each VNet's ranges come from its OWN textarea, so a
        # VNet can have ANY number of address prefixes. Shared VNet -> aishared;
        # Foundry VNet -> aifoundry. Each textarea holds one CIDR per line (or
        # comma-separated); normalise into an HCL list of the form "a","b",...
        SHARED_RANGES_RAW=$(awk '/^### Shared VNet Address Ranges$/{flag=1; next} /^### /{flag=0} flag' issue.txt)
        FOUNDRY_RANGES_RAW=$(awk '/^### Foundry VNet Address Ranges$/{flag=1; next} /^### /{flag=0} flag' issue.txt)
        VNET_A_LIST=$(printf '%s\n' "$SHARED_RANGES_RAW"  | tr ',' '\n' | tr -d '\r' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' | awk 'NF' | sed -E 's/^/"/; s/$/"/' | paste -sd, -)
        VNET_B_LIST=$(printf '%s\n' "$FOUNDRY_RANGES_RAW" | tr ',' '\n' | tr -d '\r' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' | awk 'NF' | sed -E 's/^/"/; s/$/"/' | paste -sd, -)
        # Combined list kept for backward compat with the env passthrough (unused in seds).
        VNET_AS_LIST=$(printf '%s\n%s\n' "$SHARED_RANGES_RAW" "$FOUNDRY_RANGES_RAW" | tr ',' '\n' | tr -d '\r' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' | awk 'NF' | sed -E 's/^/"/; s/$/"/' | paste -sd, -)
        PE_SUBNET=$(awk '/^### PE Subnet Address Prefix$/{getline; getline; print; exit}' issue.txt | xargs)
        AGW_SUBNET=$(awk '/^### Application Gateway Subnet Address Prefix$/{getline; getline; print; exit}' issue.txt | xargs)
        APIM_SUBNET=$(awk '/^### APIM Subnet Address Prefix$/{getline; getline; print; exit}' issue.txt | xargs)
        VM_SUBNET=$(awk '/^### VM Subnet Address Prefix$/{getline; getline; print; exit}' issue.txt | xargs)
        FOUNDRY_AGT_SUBNET=$(awk '/^### Foundry Agent Subnet Address Prefix$/{getline; getline; print; exit}' issue.txt | xargs)
        FOUNDRY_PE_SUBNET=$(awk '/^### Foundry PE Subnet Address Prefix$/{getline; getline; print; exit}' issue.txt | xargs)

        echo "SUBSCRIPTION=$SUBSCRIPTION" >> $GITHUB_ENV
        echo "SUBSCRIPTION_ID=$SUBSCRIPTION_ID" >> $GITHUB_ENV
        echo "ENV=$ENV" >> $GITHUB_ENV
        echo "ENV_SHORT=$ENV_SHORT" >> $GITHUB_ENV
        echo "REGION=$REGION" >> $GITHUB_ENV
        echo "REGION_CODE=$REGION_CODE" >> $GITHUB_ENV
        echo "ORG=$ORG" >> $GITHUB_ENV
        echo "AU=$AU" >> $GITHUB_ENV
        echo "BU=$BU" >> $GITHUB_ENV
        echo "OWNER=$OWNER" >> $GITHUB_ENV
        echo "ITERATOR=$ITERATOR" >> $GITHUB_ENV
        echo "BUSINESS_OWNER=$BUSINESS_OWNER" >> $GITHUB_ENV
        echo "BUSINESS_UNIT=$BUSINESS_UNIT" >> $GITHUB_ENV
        echo "CRITICALITY=$CRITICALITY" >> $GITHUB_ENV
        echo "COST_CENTER=$COST_CENTER" >> $GITHUB_ENV
        echo "DATA_CLASSIFICATION=$DATA_CLASSIFICATION" >> $GITHUB_ENV
        echo "COMPLIANCE=$COMPLIANCE" >> $GITHUB_ENV
        echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
        echo "BUDGET_ID=$BUDGET_ID" >> $GITHUB_ENV
        echo "STATUS=$STATUS" >> $GITHUB_ENV
        echo "APP_SUPPORT=$APP_SUPPORT" >> $GITHUB_ENV
        echo "VNET_AS_LIST=$VNET_AS_LIST" >> $GITHUB_ENV
        echo "VNET_A_LIST=$VNET_A_LIST" >> $GITHUB_ENV
        echo "VNET_B_LIST=$VNET_B_LIST" >> $GITHUB_ENV
        echo "PE_SUBNET=$PE_SUBNET" >> $GITHUB_ENV
        echo "AGW_SUBNET=$AGW_SUBNET" >> $GITHUB_ENV
        echo "APIM_SUBNET=$APIM_SUBNET" >> $GITHUB_ENV
        echo "VM_SUBNET=$VM_SUBNET" >> $GITHUB_ENV
        echo "FOUNDRY_AGT_SUBNET=$FOUNDRY_AGT_SUBNET" >> $GITHUB_ENV
        echo "FOUNDRY_PE_SUBNET=$FOUNDRY_PE_SUBNET" >> $GITHUB_ENV
        echo "LOCATION=$LOCATION" >> $GITHUB_ENV

        echo "env_short=${ENV_SHORT}" >> $GITHUB_OUTPUT
        echo "region_code=${REGION_CODE}" >> $GITHUB_OUTPUT
        echo "iterator=${ITERATOR}" >> $GITHUB_OUTPUT
        echo "Environment: $ENV ($ENV_SHORT)"
        echo "Region: $REGION ($REGION_CODE)"

    - name: Populate tfvars tokens
      env:
        SUBSCRIPTION_ID: ${{ env.SUBSCRIPTION_ID }}
        ENV_SHORT: ${{ env.ENV_SHORT }}
        REGION_CODE: ${{ env.REGION_CODE }}
        ENV: ${{ env.ENV }}
        REGION: ${{ env.REGION }}
        ORG: ${{ env.ORG }}
        AU: ${{ env.AU }}
        BU: ${{ env.BU }}
        OWNER: ${{ env.OWNER }}
        ITERATOR: ${{ env.ITERATOR }}
        BUSINESS_OWNER: ${{ env.BUSINESS_OWNER }}
        BUSINESS_UNIT: ${{ env.BUSINESS_UNIT }}
        CRITICALITY: ${{ env.CRITICALITY }}
        COST_CENTER: ${{ env.COST_CENTER }}
        DATA_CLASSIFICATION: ${{ env.DATA_CLASSIFICATION }}
        COMPLIANCE: ${{ env.COMPLIANCE }}
        APP_NAME: ${{ env.APP_NAME }}
        BUDGET_ID: ${{ env.BUDGET_ID }}
        STATUS: ${{ env.STATUS }}
        APP_SUPPORT: ${{ env.APP_SUPPORT }}
        VNET_AS_LIST: ${{ env.VNET_AS_LIST }}
        VNET_A_LIST: ${{ env.VNET_A_LIST }}
        VNET_B_LIST: ${{ env.VNET_B_LIST }}
        PE_SUBNET: ${{ env.PE_SUBNET }}
        AGW_SUBNET: ${{ env.AGW_SUBNET }}
        APIM_SUBNET: ${{ env.APIM_SUBNET }}
        VM_SUBNET: ${{ env.VM_SUBNET }}
        FOUNDRY_AGT_SUBNET: ${{ env.FOUNDRY_AGT_SUBNET }}
        FOUNDRY_PE_SUBNET: ${{ env.FOUNDRY_PE_SUBNET }}
        BASTION_CIDR: ${{ vars.BASTION_CIDR }}
        DNS_RESOLVER_IP: ${{ vars.DNS_RESOLVER_IP }}
        LOCATION: ${{ env.LOCATION }}
        TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      run: |
        TFVARS_FILE="./AI_Patterns/variables.tfvars"
        sed -i -E "s/(^[[:space:]]*subscription_id[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${SUBSCRIPTION_ID}\2/g" "$TFVARS_FILE"
        sed -i -E "s/(^[[:space:]]*env[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${ENV_SHORT}\2/g"           "$TFVARS_FILE"
        sed -i -E "s/(^[[:space:]]*region_code[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${REGION_CODE}\2/g"   "$TFVARS_FILE"
        sed -i -E "s/(^[[:space:]]*org[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${ORG}\2/g"                   "$TFVARS_FILE"
        sed -i -E "s/(^[[:space:]]*au[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${AU}\2/g"                     "$TFVARS_FILE"
        sed -i -E "s/(^[[:space:]]*bu[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${BU}\2/g"                     "$TFVARS_FILE"
        sed -i -E "s/(^[[:space:]]*owner[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${OWNER}\2/g"               "$TFVARS_FILE"
        sed -i -E "s/(^[[:space:]]*iterator[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${ITERATOR}\2/g"          "$TFVARS_FILE"
        sed -i -E "s/(^[[:space:]]*environment[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${ENV}\2/g"           "$TFVARS_FILE"
        sed -i -E "s/(^[[:space:]]*region[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${REGION}\2/g"             "$TFVARS_FILE"
        sed -i -E "s/(^[[:space:]]*business_owner[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${BUSINESS_OWNER}\2/g" "$TFVARS_FILE"
        sed -i -E "s/(^[[:space:]]*business_unit[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${BUSINESS_UNIT}\2/g"   "$TFVARS_FILE"
        sed -i -E "s/(^[[:space:]]*criticality[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${CRITICALITY}\2/g"       "$TFVARS_FILE"
        sed -i -E "s/(^[[:space:]]*cost_center[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${COST_CENTER}\2/g"       "$TFVARS_FILE"
        sed -i -E "s/(^[[:space:]]*data_classification[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${DATA_CLASSIFICATION}\2/g" "$TFVARS_FILE"
        sed -i -E "s/(^[[:space:]]*compliance[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${COMPLIANCE}\2/g"         "$TFVARS_FILE"
        sed -i -E "s/(^[[:space:]]*app_name[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${APP_NAME}\2/g"             "$TFVARS_FILE"
        sed -i -E "s/(^[[:space:]]*budget_id[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${BUDGET_ID}\2/g"           "$TFVARS_FILE"
        sed -i -E "s/(^[[:space:]]*status[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${STATUS}\2/g"                 "$TFVARS_FILE"
        sed -i -E "s/(^[[:space:]]*app_support[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${APP_SUPPORT}\2/g"       "$TFVARS_FILE"

        # aishared VNet gets the FIRST range; the dedicated Foundry VNet gets ALL
        # REMAINING ranges (VNET_B_LIST may be a single prefix or, per Amit's
        # sizing, TWO prefixes: Foundry /25 for the agent subnet + /27 for the PE
        # subnet). Both seds inject an HCL list, so one or many prefixes are fine.
        sed -i -E "/\"mbb-vnet-aishared-/,/^  \}/ s|(address_space[[:space:]]*=[[:space:]]*)\[[^]]*\]|\1[${VNET_A_LIST}]|" "$TFVARS_FILE"
        sed -i -E "/\"mbb-vnet-aifoundry-/,/^  \}/ s|(address_space[[:space:]]*=[[:space:]]*)\[[^]]*\]|\1[${VNET_B_LIST}]|" "$TFVARS_FILE"

        # Class A subnets.
        sed -i -E "/\"mbb-snet-pe-aishared-/,/^      \}/   s|(address_prefix[[:space:]]*=[[:space:]]*\")[^\"]*(\")|\1${PE_SUBNET}\2|"        "$TFVARS_FILE"
        sed -i -E "/\"mbb-snet-agw-aishared-/,/^      \}/  s|(address_prefix[[:space:]]*=[[:space:]]*\")[^\"]*(\")|\1${AGW_SUBNET}\2|"       "$TFVARS_FILE"
        sed -i -E "/\"mbb-snet-apim-aishared-/,/^      \}/ s|(address_prefix[[:space:]]*=[[:space:]]*\")[^\"]*(\")|\1${APIM_SUBNET}\2|"      "$TFVARS_FILE"
        sed -i -E "/\"mbb-snet-vm-aishared-/,/^      \}/   s|(address_prefix[[:space:]]*=[[:space:]]*\")[^\"]*(\")|\1${VM_SUBNET}\2|"        "$TFVARS_FILE"

        # Foundry subnets (Class B when a Class B range is given, otherwise
        # carved from Class A - the prefixes are applied as provided either way).
        sed -i -E "/\"mbb-snet-agt-aifoundry-/,/^      \}/ s|(address_prefix[[:space:]]*=[[:space:]]*\")[^\"]*(\")|\1${FOUNDRY_AGT_SUBNET}\2|" "$TFVARS_FILE"
        sed -i -E "/\"mbb-snet-pe-aifoundry-/,/^      \}/  s|(address_prefix[[:space:]]*=[[:space:]]*\")[^\"]*(\")|\1${FOUNDRY_PE_SUBNET}\2|"   "$TFVARS_FILE"

        # Bastion CIDR: replace ONLY the {bastion_cidr} placeholder (the VM subnet
        # Allow-Bastion-RDP-SSH rule). Do NOT touch other source_address_prefix
        # values - the APIM/AGW NSG rules use SERVICE TAGS (ApiManagement,
        # AzureLoadBalancer, VirtualNetwork, GatewayManager) that MUST be preserved
        # (a global replace here clobbers them and breaks APIM's :3443 check).
        sed -i "s|{bastion_cidr}|${BASTION_CIDR}|g"  "$TFVARS_FILE"
        # Spoke VNet DNS -> hub DNS Private Resolver inbound endpoint.
        sed -i -E "s|(dns_servers[[:space:]]*=[[:space:]]*\[\")[^\"]*(\"\])|\1${DNS_RESOLVER_IP}\2|g"                  "$TFVARS_FILE"
        # Azure location for region-pinned resources.
        sed -i "s|{location}|${LOCATION}|g"          "$TFVARS_FILE"
        # APIM JWT validation tenant.
        sed -i "s|{tenant}|${TENANT_ID}|g"           "$TFVARS_FILE"

        sed -i "s/{org}/${ORG}/g"                 "$TFVARS_FILE"
        sed -i "s/{env}/${ENV_SHORT}/g"           "$TFVARS_FILE"
        sed -i "s/{region_code}/${REGION_CODE}/g" "$TFVARS_FILE"
        sed -i "s/{iterator}/${ITERATOR}/g"       "$TFVARS_FILE"

    - name: Upload Updated tfvars
      uses: actions/upload-artifact@v4
      with:
        name: tfvars-ai
        path: "AI_Patterns/variables.tfvars"
        retention-days: 1

  terraform:
    runs-on: [self-hosted, Linux, X64, vmss-sea]
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    needs: [Extract-Parameters-from-Issue]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Updated tfvars
        uses: actions/download-artifact@v4
        with:
          name: tfvars-ai
          path: "AI_Patterns/"

      - name: Verify vendored modules present
        run: |
          if [ -z "$(ls -A AI_Patterns/modules 2>/dev/null)" ]; then
            echo "❌ AI_Patterns/modules is empty - commit the vendored modules to the repo"; exit 1
          fi
          echo "✅ Using vendored modules from AI_Patterns/modules"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Terraform Init
        env:
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_USE_OIDC: true
          ENV_SHORT:   ${{ needs.Extract-Parameters-from-Issue.outputs.env_short }}
          REGION_CODE: ${{ needs.Extract-Parameters-from-Issue.outputs.region_code }}
          ITERATOR:    ${{ needs.Extract-Parameters-from-Issue.outputs.iterator }}
        run: |
          terraform -chdir="AI_Patterns" init \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=aiApp-${ENV_SHORT}-${REGION_CODE}-${ITERATOR}.tfstate" \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="subscription_id=${{ secrets.TFSTATE_SUBSCRIPTION_ID }}"

      - name: Terraform Plan (with fallback)
        env:
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_USE_OIDC: true
        run: |
          echo "Running Terraform plan..."
          terraform -chdir="AI_Patterns" plan -var-file="variables.tfvars" -var="sql_admin_object_id=${{ vars.SQL_ADMIN_OBJECT_ID }}" -var="login_username=${{ vars.SQL_ADMIN_UPN }}" -out=tfplan || \
          (echo "Human-readable plan failed, retrying in JSON mode"; \
           terraform -chdir="AI_Patterns" plan -var-file="variables.tfvars" -var="sql_admin_object_id=${{ vars.SQL_ADMIN_OBJECT_ID }}" -var="login_username=${{ vars.SQL_ADMIN_UPN }}" -out=tfplan -json > plan.json)

      - name: Terraform Apply
        env:
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_USE_OIDC: true
        # -parallelism=1 is REQUIRED for AI Foundry: projects/deployments hold an
        # ETag lock on the account, so concurrent PUTs 412/timeout.
        run: terraform -chdir="AI_Patterns" apply -auto-approve -parallelism=1 tfplan

  checkov:
    runs-on: [self-hosted, Linux, X64, vmss-sea]
    needs: terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download Updated tfvars
        uses: actions/download-artifact@v4
        with:
          name: tfvars-ai
          path: "AI_Patterns/"
      - name: Run Checkov scan
        run: |
          checkov -d "AI_Patterns" --framework terraform --quiet --soft-fail --output cli --output json

  close-issue:
    name: Close Issue on Success
    runs-on: [self-hosted, Linux, X64, vmss-sea]
    needs: [terraform, checkov]
    if: success()
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Comment and Close Issue (REST API)
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          API="${{ github.api_url }}/repos/${{ github.repository }}/issues/${ISSUE_NUMBER}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '%s\n\n%s\n\n%s' \
            "✅ AI landing zone deployed successfully." \
            "Workflow run: $RUN_URL" \
            "Closing this issue automatically.")
          curl -fsSL -X POST "${API}/comments" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg b "$BODY" '{body:$b}')"
          curl -fsSL -X PATCH "${API}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"state":"closed","state_reason":"completed"}'
