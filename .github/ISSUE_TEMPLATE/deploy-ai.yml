name: AI Landing Zone Deployment Request
description: Request an AI landing-zone deployment (single VNet, two address ranges) through a GitHub Issue
title: "[DEPLOY-AI]: "
labels: ["deployment", "ai-lz"]

body:

  - type: markdown
    attributes:
      value: |
        ## AI Landing Zone
        Opening this issue triggers `.github/workflows/ai-pattern.yml`, which deploys
        the consolidated AI landing zone (shared networking + Key Vault + Storage +
        ACR, AI Foundry account/projects/deployments, APIM, Redis, AI Search, SQL,
        Cosmos DB, Event Grid and RBAC) into the target subscription for the
        selected environment / region.

        This pattern uses **TWO VNets**: a **shared VNet** (Class A range) for the
        general/shared subnets, and a **dedicated AI Foundry VNet** (Class B range)
        for the Standard-Agent network injection + Foundry private endpoints, on
        Azure-provided DNS. Provide the ranges in order: the **FIRST** range is used
        for the shared VNet, the **SECOND** for the Foundry VNet. All CIDRs must be
        non-overlapping, IPAM-allocated.

        > **Target subscription** is taken from the `WORKLOAD_SUBSCRIPTION_ID`
        > repository variable (Settings → Secrets and variables → Actions →
        > Variables), not from this form.

  - type: markdown
    attributes:
      value: "## Naming Mandatory Variables"

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Deployment environment. Sets the {env} token in every resource name (Prod→pd, Dev→dev, SIT→sit, UAT→uat) and the 'environment' tag.
      options:
        - Dev
        - SIT
        - UAT
        - Prod
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: Region
      description: Azure region. Sets the {region_code} token in names (Southeast Asia→sea, Malaysia West→myw, etc.) and the deploy location.
      options:
        - Southeast Asia
        - Malaysia West
        - East Asia
        - Indonesia Central
        - East US
    validations:
      required: true

  - type: input
    id: org
    attributes:
      label: Organisation Code
      description: Short organisation/prefix code. Used as the FIRST token ({org}) in EVERY resource name — e.g. 'test' → test-rg-aishared-….
      value: "test"
    validations:
      required: true

  - type: input
    id: au
    attributes:
      label: AU Code
      description: "Accounting Unit code (numeric, e.g. 00000). Required by the naming module but NOT shown in resource names or the standard tags."
      value: "00000"
    validations:
      required: true

  - type: input
    id: bu
    attributes:
      label: Business Unit Code
      description: "Business unit code (e.g. IT). Required by the naming module but NOT shown in resource names (name = {org}-{type}-{app_code}-{env}-{region_code}). Tagging uses the 'Business Unit' field below."
      value: "it"
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: Owner
      description: Owning team or person. Applied as the 'owner' tag.
      value: "platform-team"
    validations:
      required: true

  - type: input
    id: iterator
    attributes:
      label: Iterator
      description: Instance number suffix (01, 02, 03…) appended to ALL resource names. Bump it to deploy a fresh instance and avoid soft-deleted name locks.
      value: "01"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Mandatory Tags"

  - type: input
    id: business_owner
    attributes:
      label: Business Owner
      description: Accountable business owner. Applied as a governance tag.
      value: "Platform Engineering Lead"
    validations:
      required: true

  - type: input
    id: business_unit
    attributes:
      label: Business Unit
      description: Business unit name. Applied as a governance tag.
      value: "engineering"
    validations:
      required: true

  - type: input
    id: criticality
    attributes:
      label: Criticality
      description: Enter the criticality tier (e.g. T1, T2, T3, T4)
      value: "T1"
    validations:
      required: true

  - type: input
    id: cost_center
    attributes:
      label: Cost Center
      description: Finance cost-center code for chargeback. Applied as a finance tag.
      value: "383-80572"
    validations:
      required: true

  - type: dropdown
    id: data_classification
    attributes:
      label: Data Classification
      description: Data sensitivity level. Applied as a governance tag.
      options:
        - Business Sensitive
        - Confidential
        - Internal
        - Public
    validations:
      required: true

  - type: input
    id: compliance
    attributes:
      label: Compliance
      description: Compliance framework(s) the workload must meet (e.g. BNM RMIT, None). Applied as a governance tag.
      value: "BNM RMIT"
    validations:
      required: true

  - type: input
    id: app_name
    attributes:
      label: Application Name
      description: Application/workload name. Applied as the app_name business tag.
      value: "AI Landing Zone"
    validations:
      required: true

  - type: input
    id: budget_id
    attributes:
      label: Budget ID
      description: Budget identifier for cost tracking. Applied as a finance tag.
      value: "83254"
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      description: Lifecycle status. Applied as an operations tag.
      options:
        - Live
        - Non-Operational
        - Decommissioned
    validations:
      required: true

  - type: input
    id: app_support
    attributes:
      label: Application Support Email
      description: Support/distribution email for alerts and ownership. Applied as a tag.
      value: "platform-alerts@example.com"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Governance"

  - type: dropdown
    id: deploy_policies
    attributes:
      label: Deploy AI LZ policies
      description: "Deploy the Azure Policy guardrail set (MCSB v2, custom + built-in) at SUBSCRIPTION scope alongside this AI LZ. Yes = policy definitions + assignments are applied; No = skip. Default No."
      options:
        - "No"
        - "Yes"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Network Configuration
        Provide the address ranges for **each VNet separately**, one CIDR per line
        (or comma-separated). Each VNet can have **any number** of ranges.
        Recommended: **Shared VNet** = one `/23`; **Foundry VNet** = a `/25`
        (Agent subnet) plus a `/27` (PE subnet). Each subnet prefix below must sit
        inside its VNet's range(s). All CIDRs must be non-overlapping - both VNets
        peer to the platform hub, so overlaps are rejected.

  - type: textarea
    id: shared_vnet_address_ranges
    attributes:
      label: Shared VNet Address Ranges
      description: "One or more CIDRs for the shared VNet (PE / AGW / APIM / VM subnets). One per line."
      placeholder: |
        10.248.72.0/23
    validations:
      required: true

  - type: textarea
    id: foundry_vnet_address_ranges
    attributes:
      label: Foundry VNet Address Ranges
      description: "One or more CIDRs for the AI Foundry VNet (Agent + PE subnets). One per line."
      placeholder: |
        10.248.74.0/25
        10.248.74.128/27
    validations:
      required: true

  - type: input
    id: pe_subnet_address_prefix
    attributes:
      label: PE Subnet Address Prefix
      description: Private-endpoint subnet, within one of the VNet ranges (e.g. 10.248.28.0/26)
    validations:
      required: true

  - type: input
    id: agw_subnet_address_prefix
    attributes:
      label: Application Gateway Subnet Address Prefix
      description: Within one of the VNet ranges (e.g. 10.248.28.64/26)
    validations:
      required: true

  - type: input
    id: apim_subnet_address_prefix
    attributes:
      label: APIM Subnet Address Prefix
      description: Within one of the VNet ranges (e.g. 10.248.28.128/26)
    validations:
      required: true

  - type: input
    id: vm_subnet_address_prefix
    attributes:
      label: VM Subnet Address Prefix
      description: Within one of the VNet ranges (e.g. 10.248.28.192/26)
    validations:
      required: true

  - type: input
    id: foundry_agt_subnet_address_prefix
    attributes:
      label: Foundry Agent Subnet Address Prefix
      description: Container App Environment for the Standard Agent - MUST be in the Foundry /25 range, min /25 (e.g. 10.248.74.0/25)
    validations:
      required: true

  - type: input
    id: foundry_pe_subnet_address_prefix
    attributes:
      label: Foundry PE Subnet Address Prefix
      description: Foundry private endpoints - MUST be in the Foundry /27 range (e.g. 10.248.74.128/27)
    validations:
      required: true

  - type: input
    id: dns_resolver_ip
    attributes:
      label: DNS Resolver IP
      description: Inbound IP of the hub DNS Private Resolver. Spoke VNets use it as their DNS server. Read it from the hub resolver's inbound endpoint (it is dynamically assigned, not fixed).
      placeholder: "10.247.130.196"
    validations:
      required: true
