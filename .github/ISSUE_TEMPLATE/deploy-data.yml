name: Data Landing Zone Deployment Request
description: Request a Data landing-zone deployment through a GitHub Issue
title: "[DEPLOY-DATA]: "
labels: ["deployment", "data-lz"]

body:

  - type: markdown
    attributes:
      value: |
        ## Data Landing Zone
        Opening this issue triggers `.github/workflows/data-pattern.yml`, which
        deploys the consolidated Data landing zone (shared networking + Key Vault
        + SQL, ADLS storage, Azure Data Factory, Fabric capacity and RBAC) into
        the target subscription for the selected environment / region.

        > **Target subscription** is taken from the `WORKLOAD_SUBSCRIPTION_ID`
        > repository variable (Settings → Secrets and variables → Actions →
        > Variables), not from this form.

  - type: markdown
    attributes:
      value: "## Naming Mandatory Variables"

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Deployment environment. Sets the {env} token in every resource name (Prod→pd, Dev→dev, SIT→sit, UAT→uat, Test→tst) and the 'environment' tag.
      options:
        - Dev
        - SIT
        - UAT
        - Prod
        - Test
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: Region
      description: Azure region. Sets the {region_code} token in names (Southeast Asia→sea, Malaysia West→myw, etc.) and the deploy location.
      options:
        - Southeast Asia
        - Malaysia West
        - East Asia
        - Indonesia Central
        - East US
    validations:
      required: true

  - type: input
    id: org
    attributes:
      label: Organisation Code
      description: Short organisation/prefix code. Used as the FIRST token ({org}) in EVERY resource name — e.g. 'test' → test-rg-datashared-….
      value: "test"
    validations:
      required: true

  - type: input
    id: au
    attributes:
      label: AU Code
      description: Accounting Unit code. Applied as a cost-allocation tag (cost_allocation_unit).
      value: "00000"
    validations:
      required: true

  - type: input
    id: bu
    attributes:
      label: Business Unit Code
      description: Short business unit code used in resource naming
      value: "it"
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: Owner
      description: Resource owner team or individual
      value: "platform-team"
    validations:
      required: true

  - type: input
    id: iterator
    attributes:
      label: Iterator
      description: Instance number suffix (01, 02, 03…) appended to ALL resource names. Bump it to deploy a fresh instance and avoid soft-deleted name locks.
      value: "01"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Mandatory Tags"

  - type: input
    id: business_owner
    attributes:
      label: Business Owner
      description: Accountable business owner. Applied as a governance tag.
      value: "Platform Engineering Lead"
    validations:
      required: true

  - type: input
    id: business_unit
    attributes:
      label: Business Unit
      description: Business unit name. Applied as a governance tag.
      value: "engineering"
    validations:
      required: true

  - type: input
    id: criticality
    attributes:
      label: Criticality
      description: Enter the criticality tier (e.g. T1, T2, T3, T4)
      value: "T1"
    validations:
      required: true

  - type: input
    id: cost_center
    attributes:
      label: Cost Center
      description: Finance cost-center code for chargeback. Applied as a finance tag.
      value: "383-80572"
    validations:
      required: true

  - type: dropdown
    id: data_classification
    attributes:
      label: Data Classification
      description: Data sensitivity level. Applied as a governance tag.
      options:
        - Business Sensitive
        - Confidential
        - Internal
        - Public
    validations:
      required: true

  - type: input
    id: compliance
    attributes:
      label: Compliance
      description: Compliance framework(s) the workload must meet (e.g. BNM RMIT, None). Applied as a governance tag.
      value: "BNM RMIT"
    validations:
      required: true

  - type: input
    id: app_name
    attributes:
      label: Application Name
      description: Application/workload name. Applied as the app_name business tag.
      value: "Data Landing Zone"
    validations:
      required: true

  - type: input
    id: budget_id
    attributes:
      label: Budget ID
      description: Budget identifier for cost tracking. Applied as a finance tag.
      value: "83254"
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      description: Lifecycle status. Applied as an operations tag.
      options:
        - Live
        - Non-Operational
        - Decommissioned
    validations:
      required: true

  - type: input
    id: app_support
    attributes:
      label: Application Support Email
      description: Support/distribution email for alerts and ownership. Applied as a tag.
      value: "platform-alerts@example.com"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Network Configuration
        Provide IPAM-allocated, non-overlapping CIDRs for the target region. The
        VNet peers to the platform hub, so overlapping ranges are rejected. The
        data VNet can use ANY number of address ranges. Enter one CIDR per line
        (or comma-separated) below; the four subnets (data, internal-data, PE,
        consumption) must each sit inside one of the ranges you provide.
        Example (DEV): 10.247.152.0/24 and 10.247.153.0/25.

  - type: textarea
    id: data_vnet_address_ranges
    attributes:
      label: Data VNet Address Ranges
      description: One CIDR per line (or comma-separated). e.g. 10.247.152.0/24 and 10.247.153.0/25
      placeholder: |
        10.247.152.0/24
        10.247.153.0/25
    validations:
      required: true

  - type: input
    id: pe_subnet_address_prefix
    attributes:
      label: PE Subnet Address Prefix
      description: CIDR prefix for the private-endpoint subnet, within range 2 (e.g. 10.247.153.0/26)
    validations:
      required: true

  - type: input
    id: data_subnet_address_prefix
    attributes:
      label: Data Subnet Address Prefix
      description: CIDR prefix for the data services subnet, within range 1 (e.g. 10.247.152.0/25)
    validations:
      required: true

  - type: input
    id: int_subnet_address_prefix
    attributes:
      label: Internal Data Subnet Address Prefix
      description: CIDR prefix for the internal data (compute) subnet, within range 1 (e.g. 10.247.152.128/25)
    validations:
      required: true

  - type: input
    id: consumption_subnet_address_prefix
    attributes:
      label: Consumption Data Subnet Address Prefix
      description: CIDR prefix for the consumption data subnet, within range 2 (e.g. 10.247.153.64/26)
    validations:
      required: true

  - type: input
    id: dns_resolver_ip
    attributes:
      label: DNS Resolver IP
      description: Inbound IP of the hub DNS Private Resolver. Spoke VNets use it as their DNS server. Read it from the hub resolver's inbound endpoint (it is dynamically assigned, not fixed).
      placeholder: "10.247.130.196"
    validations:
      required: true
